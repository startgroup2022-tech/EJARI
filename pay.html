<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>إيجاري — إتمام الدفع · Ejari — Complete payment</title>
<link rel="icon" href="favicon.ico">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--brand:#0C7D63;--ink:#17253B;--mut:#7D8CA1;--line:#DEE4EC;--sf:#fff;--sf2:#F2F5F9;--ok:#17794F;--oksoft:#DFF2E8;--bad:#B3261E;--badsoft:#FBE6E4;--info:#2563A8;--infosoft:#E4EEF9}
*{box-sizing:border-box}
body{margin:0;font:15px/1.7 'Segoe UI',Tahoma,system-ui,sans-serif;color:var(--ink);background:var(--sf2);min-height:100vh;display:grid;place-items:center;padding:24px}
.pay{width:100%;max-width:520px;background:var(--sf);border:1px solid var(--line);border-radius:16px;padding:30px;box-shadow:0 10px 40px rgba(23,37,59,.08)}
h1{font-size:20px;margin:0 0 4px}
.mut{color:var(--mut);font-size:13px}
.amt{font-size:34px;font-weight:700;margin:14px 0 2px}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}
.kv{width:100%;border-collapse:collapse;margin:18px 0}
.kv td{padding:9px 0;border-bottom:1px solid var(--line)}
.kv td:first-child{color:var(--mut);width:42%}
.kv td:last-child{font-weight:600;text-align:end}
.badge{display:inline-block;border-radius:99px;padding:4px 12px;font-size:13px;background:var(--infosoft);color:var(--info)}
.badge.ok{background:var(--oksoft);color:var(--ok)}
.badge.bad{background:var(--badsoft);color:var(--bad)}
button{font:inherit;border:0;border-radius:10px;padding:12px 18px;cursor:pointer;font-weight:600}
.brand{background:var(--brand);color:#fff}
.ghost{background:var(--sf2);color:var(--ink);border:1px solid var(--line)}
.danger{background:var(--badsoft);color:var(--bad)}
.actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.note{margin-top:16px;font-size:12.5px;color:var(--mut);border-top:1px solid var(--line);padding-top:14px}
.spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:s 1s linear infinite;margin:20px auto}
@keyframes s{to{transform:rotate(360deg)}}
.center{text-align:center}
</style>
</head>
<body>
<main class="pay" id="app">
  <div class="center"><div class="spin"></div><p class="mut">جارٍ تحميل بيانات الدفع… · Loading payment…</p></div>
</main>
<script>
(function(){
  var ref = new URLSearchParams(location.search).get('ref') || '';
  var ar = (document.documentElement.lang || 'ar') === 'ar';
  var app = document.getElementById('app');
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function T(a,e){return ar?a:e}
  function money(n,cur){return ar?(Number(n).toLocaleString('en-US')+' د.ب'):('BD '+Number(n).toLocaleString('en-US'))}
  var LABEL={pending:['بانتظار الدفع','Awaiting payment'],processing:['قيد المعالجة','Processing'],paid:['مدفوعة','Paid'],failed:['فاشلة','Failed'],cancelled:['ملغاة','Cancelled'],refunded:['مُسترجعة','Refunded']};
  function render(it){
    var st=it.status;var badgeCls = st==='paid'?'ok':(st==='failed'||st==='cancelled')?'bad':'';
    var isSandbox = it.provider==='sandbox';
    var canAct = ['pending','processing'].indexOf(st)>=0;
    app.innerHTML =
      '<h1>'+esc(T('إتمام الدفع','Complete payment'))+'</h1>'+
      '<div class="mut">'+esc(T('منصة إيجاري','Ejari platform'))+'</div>'+
      '<div class="amt">'+money(it.amount,it.currency)+'</div>'+
      '<div class="row"><span class="badge '+badgeCls+'">'+esc(T(LABEL[st][0],LABEL[st][1]))+'</span>'+(it.testMode?'<span class="badge">'+esc(T('وضع الاختبار','Test mode'))+'</span>':'')+'</div>'+
      '<table class="kv">'+
        '<tr><td>'+esc(T('المرجع','Reference'))+'</td><td dir="ltr">'+esc(it.reference)+'</td></tr>'+
        '<tr><td>'+esc(T('بوابة الدفع','Gateway'))+'</td><td>'+esc(it.provider)+'</td></tr>'+
        (it.providerRef?'<tr><td>'+esc(T('مرجع المزوّد','Provider ref'))+'</td><td dir="ltr">'+esc(it.providerRef)+'</td></tr>':'')+
      '</table>'+
      (canAct && isSandbox ?
        '<div class="actions"><button class="ghost" id="fail">'+esc(T('محاكاة فشل الدفع','Simulate failure'))+'</button><span class="sp"></span><button class="brand" id="pay">'+esc(T('تأكيد الدفع','Confirm payment'))+'</button></div>'
        : canAct && it.redirectUrl ?
        '<div class="actions"><button class="brand" id="gotoprovider">'+esc(T('الدفع لدى بوابة الدفع','Pay on the provider page'))+'</button><span class="sp"></span><button class="ghost" id="refresh">'+esc(T('تحديث الحالة','Refresh status'))+'</button></div>'
        : canAct ?
        '<div class="actions"><button class="ghost" id="refresh">'+esc(T('تحديث الحالة','Refresh status'))+'</button></div>'
        : st==='paid' ?
        '<div class="actions"><a class="brand" style="text-decoration:none;padding:12px 18px;border-radius:10px;color:#fff;background:var(--brand)" href="app.html">'+esc(T('العودة إلى إيجاري','Return to Ejari'))+'</a></div>'
        : '<div class="actions"><button class="ghost" onclick="history.back()">'+esc(T('رجوع','Back'))+'</button></div>')+
      '<div class="note">'+esc(T('لا تمرّ بيانات البطاقة عبر إيجاري إطلاقاً. يتم تأكيد الدفع من الخادم عبر إشعار موقّع من بوابة الدفع.','Card data never passes through Ejari. Payment is confirmed server-side by a signed gateway webhook.'))+'</div>';
    var p=document.getElementById('pay');if(p)p.onclick=function(){resolve('paid')};
    var f=document.getElementById('fail');if(f)f.onclick=function(){resolve('failed')};
    var r=document.getElementById('refresh');if(r)r.onclick=load;
    var g=document.getElementById('gotoprovider');if(g)g.onclick=function(){location.href=it.redirectUrl};
  }
  // Returning from a hosted provider (Tap appends tap_id): re-verify server-side before rendering.
  function verifyThenLoad(){
    fetch('/api/payments/intent/'+encodeURIComponent(ref)+'/verify',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'}})
      .then(function(){load()})
      .catch(function(){load()});
  }
  function load(){
    if(!ref){app.innerHTML='<h1>'+esc(T('مرجع دفع غير صالح','Invalid payment reference'))+'</h1>';return}
    fetch('/api/payments/intent/'+encodeURIComponent(ref),{credentials:'include'})
      .then(function(r){if(!r.ok)throw r;return r.json()})
      .then(function(d){render(d.intent)})
      .catch(function(){app.innerHTML='<h1>'+esc(T('تعذّر تحميل بيانات الدفع','Could not load the payment'))+'</h1><div class="actions"><a class="ghost" style="text-decoration:none;padding:12px 18px;border-radius:10px" href="app.html">'+esc(T('تسجيل الدخول','Sign in'))+'</a></div>'});
  }
  function resolve(outcome){
    fetch('/api/payments/intent/'+encodeURIComponent(ref)+'/sandbox-confirm',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({outcome:outcome})})
      .then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j}})})
      .then(function(res){ if(res.ok) load(); else {app.innerHTML='<h1>'+esc(T('تعذّر إتمام الدفع','Could not complete the payment'))+'</h1>';} })
      .catch(function(){app.innerHTML='<h1>'+esc(T('تعذّر إتمام الدفع','Could not complete the payment'))+'</h1>'});
  }
  if (new URLSearchParams(location.search).get('tap_id')) verifyThenLoad(); else load();
})();
</script>
</body>
</html>
