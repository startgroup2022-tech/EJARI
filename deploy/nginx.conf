# Alternative to Caddy if you already run Nginx. Get a cert first with:
#   sudo certbot --nginx -d ejari.yourdomain.com
server {
    listen 80;
    server_name ejari.yourdomain.com;
    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
