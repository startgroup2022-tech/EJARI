# Alternative to Caddy if you already run Nginx. Get a cert first with:
#   sudo certbot --nginx -d test.ejari.bh
# Replace the domain with the real hostname before running (staging here: test.ejari.bh).

# HTTP -> HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name test.ejari.bh;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name test.ejari.bh;

    # Managed by certbot (Let's Encrypt).
    ssl_certificate     /etc/letsencrypt/live/test.ejari.bh/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/test.ejari.bh/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
