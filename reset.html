<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>إيجاري — إعادة تعيين كلمة المرور · Ejari — Reset password</title>
<link rel="icon" href="favicon.ico">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--brand:#0C7D63;--ink:#17253B;--mut:#7D8CA1;--line:#DEE4EC;--sf:#fff;--sf2:#F2F5F9;--ok:#17794F;--oksoft:#DFF2E8;--bad:#B3261E;--badsoft:#FBE6E4}
*{box-sizing:border-box}
body{margin:0;font:15px/1.7 'Segoe UI',Tahoma,system-ui,sans-serif;color:var(--ink);background:var(--sf2);min-height:100vh;display:grid;place-items:center;padding:24px}
.pay{width:100%;max-width:480px;background:var(--sf);border:1px solid var(--line);border-radius:16px;padding:30px;box-shadow:0 10px 40px rgba(23,37,59,.08)}
h1{font-size:20px;margin:0 0 4px}
.mut{color:var(--mut);font-size:13px}
label{display:block;font-size:13px;font-weight:600;margin:14px 0 4px}
input{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;font:inherit;background:var(--sf)}
input:focus{outline:2px solid var(--brand);outline-offset:1px;border-color:var(--brand)}
button{font:inherit;border:0;border-radius:10px;padding:12px 18px;cursor:pointer;font-weight:600;margin-top:18px;width:100%}
.brand{background:var(--brand);color:#fff}
.brand:disabled{opacity:.6;cursor:default}
.ghost{background:var(--sf2);color:var(--ink);border:1px solid var(--line);text-decoration:none;text-align:center;display:block;margin-top:10px}
.badge{display:inline-block;border-radius:99px;padding:4px 12px;font-size:13px;background:var(--badsoft);color:var(--bad)}
.spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:s 1s linear infinite;margin:20px auto}
@keyframes s{to{transform:rotate(360deg)}}
.center{text-align:center}
.ok{background:var(--oksoft);color:var(--ok)}
.err{background:var(--badsoft);color:var(--bad);border-radius:10px;padding:10px 12px;font-size:13px;margin-top:12px;display:none}
</style>
</head>
<body>
<main class="pay" id="app">
  <div class="center"><div class="spin"></div><p class="mut">جارٍ التحقق من الرابط… · Checking the link…</p></div>
</main>
<script>
(function(){
  var ar = (document.documentElement.lang || 'ar') === 'ar';
  var app = document.getElementById('app');
  var token = new URLSearchParams(location.search).get('token') || '';
  function T(a,e){return ar?a:e}
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function show(html){app.innerHTML=html}
  function message(kind,text){show('<h1>'+esc(T('إعادة تعيين كلمة المرور','Reset password'))+'</h1><p class="mut">'+esc(T('منصة إيجاري','Ejari platform'))+'</p><div class="badge '+(kind==='ok'?'ok':'')+'" style="margin-top:14px">'+esc(text)+'</div>'+(kind==='ok'?'<a class="ghost" href="app.html">'+esc(T('الانتقال لتسجيل الدخول','Go to sign in'))+'</a>':'<a class="ghost" href="website.html">'+esc(T('العودة للموقع','Back to the website'))+'</a>'));}

  function form(){
    show('<h1>'+esc(T('إعادة تعيين كلمة المرور','Reset password'))+'</h1><div class="mut">'+esc(T('منصة إيجاري','Ejari platform'))+'</div>'+
      '<label for="pw">'+esc(T('كلمة المرور الجديدة','New password'))+'</label><input id="pw" type="password" autocomplete="new-password" dir="ltr" style="text-align:start" placeholder="8+">'+
      '<label for="pw2">'+esc(T('تأكيد كلمة المرور','Confirm password'))+'</label><input id="pw2" type="password" autocomplete="new-password" dir="ltr" style="text-align:start">'+
      '<div class="err" id="err"></div>'+
      '<button class="brand" id="go">'+esc(T('حفظ كلمة المرور','Save password'))+'</button>');
    var err=document.getElementById('err');
    document.getElementById('go').onclick=function(){
      var pw=document.getElementById('pw').value, pw2=document.getElementById('pw2').value;
      err.style.display='none';
      if(pw.length<8){err.textContent=T('كلمة المرور 8 أحرف على الأقل','Password must be at least 8 characters');err.style.display='block';return}
      if(pw!==pw2){err.textContent=T('كلمتا المرور غير متطابقتين','Passwords do not match');err.style.display='block';return}
      this.disabled=true;
      fetch('/api/auth/reset-password',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:token,password:pw})})
        .then(function(r){return r.json().then(function(j){return {ok:r.ok,status:r.status,j:j}})})
        .then(function(res){
          if(res.ok){message('ok',T('تم تعيين كلمة المرور بنجاح','Your password was set successfully'));return}
          document.getElementById('go').disabled=false;
          var m={weak_password:T('كلمة المرور ضعيفة','Password is too weak'),invalid_token:T('رابط غير صالح','Invalid link'),expired_token:T('انتهت صلاحية الرابط','This link has expired')};
          err.textContent=m[res.j&&res.j.error]||T('تعذّر الحفظ','Could not save');err.style.display='block';
        })
        .catch(function(){document.getElementById('go').disabled=false;err.textContent=T('تعذّر الاتصال بالخادم','Could not reach the server');err.style.display='block'});
    };
  }

  if(!token){message('bad',T('رابط غير صالح','Invalid link'));return}
  fetch('/api/auth/reset-password/'+encodeURIComponent(token),{credentials:'include'})
    .then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j}})})
    .then(function(res){
      if(res.ok&&res.j&&res.j.valid){form();return}
      var reason=res.j&&res.j.reason;
      message('bad', reason==='expired'?T('انتهت صلاحية الرابط — اطلب رابطاً جديداً','This link has expired — request a new one'):T('رابط غير صالح أو مستخدم','Invalid or already-used link'));
    })
    .catch(function(){message('bad',T('تعذّر الاتصال بالخادم','Could not reach the server'))});
})();
</script>
</body>
</html>
